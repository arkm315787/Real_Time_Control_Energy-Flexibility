name: flexihome-ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile core modules
        run: python -m py_compile app.py flexihome/core/engine.py flexihome/core/centralized_controller.py flexihome/core/market_data.py flexihome/api/services.py
      - name: API smoke test
        run: python scripts/api_smoke.py
      - name: Plugin architecture smoke test
        run: python scripts/plugin_smoke.py
      - name: Centralized 4-second MPC smoke test
        run: python scripts/centralized_mpc_smoke.py
      - name: Risk-aware upper MPC smoke test
        run: python scripts/risk_aware_mpc_smoke.py
      - name: Dashboard scenario apply smoke test
        run: python scripts/dashboard_scenario_smoke.py
      - name: Pipeline DAG smoke test
        run: python scripts/pipeline_smoke.py
      - name: Airflow DAG smoke test
        run: python scripts/airflow_dag_smoke.py
      - name: Forecast module smoke test
        run: python scripts/run_forecasting.py --days 2 --n-homes 80 --target fcrn_capacity_eur_per_mw_h --output-root runs
      - name: Optimization module smoke test
        run: python scripts/run_optimization.py --days 2 --n-homes 80 --horizon-hours 1 --dispatch-hours 1 --output-root runs
