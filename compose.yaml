services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: coverly-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_POSTGRES_USER:-coverly}
      POSTGRES_PASSWORD: ${TIMESCALE_POSTGRES_PASSWORD:-coverly}
      POSTGRES_DB: ${TIMESCALE_POSTGRES_DB:-coverly}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:${TIMESCALE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TIMESCALE_POSTGRES_USER:-coverly} -d ${TIMESCALE_POSTGRES_DB:-coverly}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-postgres:
    image: postgres:16
    container_name: coverly-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_POSTGRES_USER:-airflow} -d ${AIRFLOW_POSTGRES_DB:-airflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: coverly-airflow:local
    container_name: coverly-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-coverly-local-airflow-secret}
      PYTHONPATH: /opt/airflow/project
      ENTSOE_API_KEY: ${ENTSOE_API_KEY:-}
      FINGRID_API_KEY: ${FINGRID_API_KEY:-}
      FLEXIHOME_FINGRID_MIN_INTERVAL_SECONDS: ${FLEXIHOME_FINGRID_MIN_INTERVAL_SECONDS:-2.1}
      FLEXIHOME_FINGRID_MAX_RETRIES: ${FLEXIHOME_FINGRID_MAX_RETRIES:-4}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Coverly --lastname Admin
      --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true"

  airflow-webserver:
    image: coverly-airflow:local
    container_name: coverly-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-coverly-local-airflow-secret}
      PYTHONPATH: /opt/airflow/project
      ENTSOE_API_KEY: ${ENTSOE_API_KEY:-}
      FINGRID_API_KEY: ${FINGRID_API_KEY:-}
      FLEXIHOME_FINGRID_MIN_INTERVAL_SECONDS: ${FLEXIHOME_FINGRID_MIN_INTERVAL_SECONDS:-2.1}
      FLEXIHOME_FINGRID_MAX_RETRIES: ${FLEXIHOME_FINGRID_MAX_RETRIES:-4}
    ports:
      - "127.0.0.1:${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/project
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20

  airflow-scheduler:
    image: coverly-airflow:local
    container_name: coverly-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-coverly-local-airflow-secret}
      PYTHONPATH: /opt/airflow/project
      ENTSOE_API_KEY: ${ENTSOE_API_KEY:-}
      FINGRID_API_KEY: ${FINGRID_API_KEY:-}
      FLEXIHOME_FINGRID_MIN_INTERVAL_SECONDS: ${FLEXIHOME_FINGRID_MIN_INTERVAL_SECONDS:-2.1}
      FLEXIHOME_FINGRID_MAX_RETRIES: ${FLEXIHOME_FINGRID_MAX_RETRIES:-4}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/project
    command: scheduler

volumes:
  timescaledb-data:
  airflow-postgres-data:
